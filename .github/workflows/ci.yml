name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pipx install poetry==2.0.1
      - run: poetry sync --with dev --all-extras
      - run: poetry run pre-commit run --all-files

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pipx install poetry==2.0.1
      - run: poetry sync --with dev --all-extras
      # The threshold is a smoke check (did the suite actually run?), not a
      # target. Integration tests need the emulator and don't run here, so the
      # Firestore I/O layers are largely uncovered in CI by design.
      - run: poetry run pytest --cov=firedantic_extras --cov-report=term-missing --cov-fail-under=50

  build:
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pipx install poetry==2.0.1
      - run: poetry build
