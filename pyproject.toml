[tool.poetry]
name = "firedantic-extras"
version = "0.1.8"
description = "Add-on utilities for Firedantic: collection sync, FastAPI pagination, BigQuery schema generation"
authors = ["Lukas Karlsson <karlsson@altissimo.io>"]
license = "BSD-3-Clause"
readme = "README.md"
repository = "https://github.com/altissimo-hq/firedantic-extras"
packages = [
    { include = "firedantic_extras", from = "src" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[tool.poetry.dependencies]
python = "^3.10"
firedantic = ">=0.13"
google-cloud-firestore = ">=2.0"
pydantic = ">=2.0"
# Optional integrations — pulled in by the extras below (pip install
# firedantic-extras[flask] etc.). Declared here, not as dependency groups:
# Poetry only exports an extra to package metadata when its packages are
# optional entries of the main dependency table.
fastapi = { version = ">=0.100", optional = true }
flask = { version = ">=2.0", optional = true }
google-cloud-bigquery = { version = ">=3.0", optional = true }

[tool.poetry.extras]
fastapi = ["fastapi"]
flask = ["flask"]
bigquery = ["google-cloud-bigquery"]
all = ["fastapi", "flask", "google-cloud-bigquery"]

[tool.poetry.group.dev.dependencies]
mypy = "^1.15.0"
pytest = ">=8.3,<10.0"
pytest-cov = ">=5.0"
ruff = ">=0.9.0"
pre-commit = "^4.5.1"
email-validator = ">=2.0"
pytest-asyncio = ">=1.0"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "S", "SIM", "PT", "TCH", "RUF"
]

[tool.ruff.lint.isort]
known-first-party = ["firedantic_extras"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106", "PT011"]

[tool.coverage.run]
source = ["firedantic_extras"]
omit = ["*/tests/*"]

[tool.coverage.report]
show_missing = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration'"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: marks tests that require the Firestore emulator (deselect with '-m \"not integration\"')",
]

[tool.skjold]
sources = ["pypa"]

[tool.mypy]
strict = true
warn_return_any = true
warn_unused_configs = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = [
    "fastapi",
    "fastapi.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "google.cloud.bigquery",
    "google.cloud.bigquery.*",
]
ignore_missing_imports = true
