[tool.poetry]
name = "firedantic-extras"
version = "0.1.5"
description = "Add-on utilities for Firedantic: collection sync, FastAPI pagination, BigQuery schema generation"
authors = ["Lukas Karlsson <karlsson@altissimo.io>"]
license = "BSD-3-Clause"
readme = "README.md"
repository = "https://github.com/altissimo-hq/firedantic-extras"
packages = [
    { include = "firedantic_extras", from = "src" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[tool.poetry.dependencies]
python = "^3.10"
firedantic = ">=0.13"
google-cloud-firestore = ">=2.0"
pydantic = ">=2.0"

[tool.poetry.extras]
fastapi = ["fastapi", "fastapi-pagination"]
flask = ["flask"]
bigquery = ["google-cloud-bigquery"]
all = ["fastapi", "fastapi-pagination", "flask", "google-cloud-bigquery"]

[tool.poetry.group.fastapi]
optional = true

[tool.poetry.group.fastapi.dependencies]
fastapi = ">=0.100"
fastapi-pagination = ">=0.12"

[tool.poetry.group.flask]
optional = true

[tool.poetry.group.flask.dependencies]
flask = ">=2.0"

[tool.poetry.group.bigquery]
optional = true

[tool.poetry.group.bigquery.dependencies]
google-cloud-bigquery = ">=3.0"

[tool.poetry.group.dev.dependencies]
mypy = "^1.15.0"
pytest = "^8.3.0"
pytest-cov = ">=5.0"
ruff = ">=0.9.0"
pre-commit = "^4.5.1"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "S", "SIM", "PT", "TCH", "RUF"
]

[tool.ruff.lint.isort]
known-first-party = ["firedantic_extras"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106", "PT011"]

[tool.coverage.run]
source = ["firedantic_extras"]
omit = ["*/tests/*"]

[tool.coverage.report]
show_missing = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = [
    "integration: marks tests that require the Firestore emulator (deselect with '-m \"not integration\"')",
]

[tool.skjold]
sources = ["pypa"]

[tool.mypy]
strict = true
warn_return_any = true
warn_unused_configs = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = [
    "fastapi",
    "fastapi.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "google.cloud.bigquery",
    "google.cloud.bigquery.*",
]
ignore_missing_imports = true
