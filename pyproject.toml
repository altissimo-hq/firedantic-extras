[project]
name = "altissimo-firedantic-extras"
version = "0.4.0"
description = "Add-on utilities for Firedantic: collection sync, FastAPI pagination, BigQuery schema generation"
authors = [{ name = "Lukas Karlsson", email = "karlsson@altissimo.io" }]
license = "BSD-3-Clause"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.10,<4.0"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    # The Altissimo fork of firedantic, published as altissimo-firedantic
    # (import name is still `firedantic`).
    "altissimo-firedantic>=0.22.3,<0.23",
    "google-cloud-firestore>=2.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
# pip install altissimo-firedantic-extras[flask] etc.
fastapi = ["fastapi>=0.100"]
flask = ["flask>=2.0"]
bigquery = ["google-cloud-bigquery>=3.0"]
all = ["fastapi>=0.100", "flask>=2.0", "google-cloud-bigquery>=3.0"]

[project.urls]
Homepage = "https://github.com/altissimo-hq/firedantic-extras"
Repository = "https://github.com/altissimo-hq/firedantic-extras"
Issues = "https://github.com/altissimo-hq/firedantic-extras/issues"
Changelog = "https://github.com/altissimo-hq/firedantic-extras/blob/main/CHANGELOG.md"

[tool.poetry]
# Only Poetry-specific settings live here; package metadata is in [project].
packages = [
    { include = "firedantic_extras", from = "src" }
]

[tool.poetry.group.dev.dependencies]
mypy = "^1.15.0"
pytest = ">=8.3,<10.0"
pytest-cov = ">=5.0"
ruff = ">=0.9.0"
pre-commit = "^4.5.1"
email-validator = ">=2.0"
pytest-asyncio = ">=1.0"

[build-system]
requires = ["poetry-core>=2.2.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "S", "SIM", "PT", "TCH", "RUF"
]

[tool.ruff.lint.isort]
known-first-party = ["firedantic_extras"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106", "PT011"]

[tool.coverage.run]
source = ["firedantic_extras"]
omit = ["*/tests/*"]

[tool.coverage.report]
show_missing = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration'"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: marks tests that require the Firestore emulator (deselect with '-m \"not integration\"')",
]

[tool.skjold]
sources = ["pypa"]

[tool.mypy]
strict = true
warn_return_any = true
warn_unused_configs = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = [
    "fastapi",
    "fastapi.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "google.cloud.bigquery",
    "google.cloud.bigquery.*",
]
ignore_missing_imports = true
